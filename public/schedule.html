<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — Gone by Monday</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">🚛 Gone by Monday</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="quotes.html" class="nav-link">
      Quotes <span id="pending-badge" class="nav-badge" style="display:none">0</span>
    </a>
    <a href="jobs.html" class="nav-link">Jobs</a>
    <a href="schedule.html" class="nav-link active">Schedule</a>
  </div>
  <div class="nav-spacer"></div>
  <button class="btn btn-outline btn-sm" onclick="logout()" style="color:#fff;border-color:rgba(255,255,255,.4)">Sign Out</button>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Weekly Schedule</h1>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button class="btn btn-outline btn-sm" onclick="prevWeek()">‹ Prev</button>
      <span id="week-label" style="font-size:.9rem;font-weight:500;min-width:200px;text-align:center"></span>
      <button class="btn btn-outline btn-sm" onclick="nextWeek()">Next ›</button>
      <button class="btn btn-primary btn-sm" onclick="goToToday()">Today</button>
    </div>
  </div>

  <div id="week-grid">
    <div class="loading"><div class="spinner"></div> Loading schedule...</div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let weekStart = getMonday(new Date());

function getMonday(d) {
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  mon.setHours(0, 0, 0, 0);
  return mon;
}

function dateStr(d) {
  return d.toLocaleDateString('en-CA');
}

function prevWeek() {
  weekStart.setDate(weekStart.getDate() - 7);
  loadWeek();
}

function nextWeek() {
  weekStart.setDate(weekStart.getDate() + 7);
  loadWeek();
}

function goToToday() {
  weekStart = getMonday(new Date());
  loadWeek();
}

async function loadWeek() {
  const start = dateStr(weekStart);
  document.getElementById('week-label').textContent = `Week of ${new Date(start + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

  const grid = document.getElementById('week-grid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';

  try {
    const days = await API.get(`/api/schedule/week/${start}`);
    renderWeek(days);
  } catch (err) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>${err.message}</h3></div>`;
  }
}

function renderWeek(days) {
  const today = new Date().toLocaleDateString('en-CA');
  const grid = document.getElementById('week-grid');

  if (days.every(d => d.jobCount === 0)) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>No jobs scheduled this week</h3></div>';
    return;
  }

  grid.innerHTML = days.filter(d => {
    const dow = new Date(d.date + 'T12:00:00').getDay();
    return dow >= 1 && dow <= 6; // Mon–Sat only
  }).map(d => dayCard(d, today)).join('');
}

function dayCard(d, today) {
  const pct = Math.min(100, d.jobCount > 0 ? (d.usedMinutes / d.totalMinutes) * 100 : 0);
  const isToday = d.date === today;
  const dayName = new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

  let headerClass = '';
  if (d.atCapacity) headerClass = 'at-capacity';
  else if (pct >= 75) headerClass = 'near-capacity';

  const fillClass = pct >= 100 ? 'full' : pct >= 75 ? 'high' : '';

  return `
  <div class="day-card" ${isToday ? 'style="border:2px solid var(--green)"' : ''}>
    <div class="day-header ${headerClass}">
      <div>
        <div class="day-name">${isToday ? '📍 ' : ''}${dayName}</div>
        <div class="day-date">${d.jobCount} job${d.jobCount !== 1 ? 's' : ''} · ${d.usedMinutes} min · ${d.landfillRuns} landfill run${d.landfillRuns !== 1 ? 's' : ''}</div>
      </div>
      <div style="display:flex;gap:.4rem">
        ${d.atCapacity ? '<span style="font-size:.75rem;background:rgba(255,255,255,.2);padding:.2rem .5rem;border-radius:20px">AT CAPACITY</span>' : ''}
        ${d.jobCount > 0 ? `<button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;border:none" onclick="optimizeDay('${d.date}')">🗺 Optimize</button>` : ''}
        ${d.jobCount > 0 ? `<button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;border:none" onclick="sendSummary('${d.date}')">📱 Summary</button>` : ''}
      </div>
    </div>

    <div class="capacity-bar">
      <div class="capacity-fill ${fillClass}" style="width:${pct}%"></div>
    </div>

    <div class="stop-list">
      ${d.jobs.length === 0
        ? '<div style="padding:.5rem 0;color:var(--gray-500);font-size:.875rem">No jobs scheduled</div>'
        : d.jobs.map((j, i) => stopItem(j, i + 1)).join('')}
    </div>

    <div style="padding:.5rem 1.25rem 1rem;display:flex;gap:.5rem">
      <button class="btn btn-outline btn-sm" onclick="addLandfillRun('${d.date}')">+ Landfill Run</button>
      <span style="font-size:.8rem;color:var(--gray-500);align-self:center">${d.remainingMinutes > 0 ? d.remainingMinutes + ' min available' : 'Day full'}</span>
    </div>
  </div>`;
}

function stopItem(j, n) {
  return `
  <div class="stop-item">
    <div class="stop-num">${n}</div>
    <div class="stop-info">
      <div class="stop-name">${j.name || fmtPhone(j.phone)}</div>
      <div class="stop-address">📍 ${j.address || '—'}${j.city ? ', ' + j.city : ''}</div>
      <div class="stop-meta">
        ${j.load_size ? loadSize(j.load_size) + ' · ' : ''}
        ~${j.estimated_duration_minutes || 60} min
        ${j.drive_time_from_prev_minutes > 0 ? ' · 🚗 +' + j.drive_time_from_prev_minutes + ' min drive' : ''}
        ${j.total_price ? ' · ' + fmt$$(j.total_price) : ''}
      </div>
    </div>
    <div class="stop-actions">
      <button class="btn btn-sm" style="background:var(--orange);color:#fff" onclick="sendReminder(${j.id})" title="Send reminder">📱</button>
      <button class="btn btn-sm btn-primary" onclick="completeJob(${j.id})" title="Complete">✓</button>
    </div>
  </div>`;
}

async function optimizeDay(date) {
  try {
    const result = await API.post(`/api/schedule/${date}/optimize`);
    showToast('Route optimized!', 'success');
    loadWeek();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function sendSummary(date) {
  if (!confirm(`Send route summary SMS to owner for ${date}?`)) return;
  try {
    await API.post(`/api/schedule/${date}/summary`);
    showToast('Route summary sent!', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function addLandfillRun(date) {
  try {
    const res = await API.post(`/api/schedule/${date}/landfill`);
    showToast(`Landfill run #${res.run_number} added`, 'success');
    loadWeek();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function sendReminder(jobId) {
  try {
    await API.post(`/api/jobs/${jobId}/remind`);
    showToast('30-min reminder sent!', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function completeJob(jobId) {
  if (!confirm('Mark this job as completed?')) return;
  try {
    await API.post(`/api/jobs/${jobId}/complete`);
    showToast('Job completed!', 'success');
    loadWeek();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function logout() {
  localStorage.removeItem('gbm_token');
  window.location.href = '/login.html';
}

loadWeek();
</script>
</body>
</html>
