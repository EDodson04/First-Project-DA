<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotes — Gone by Monday</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">🚛 Gone by Monday</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="quotes.html" class="nav-link active">
      Quotes <span id="pending-badge" class="nav-badge" style="display:none">0</span>
    </a>
    <a href="jobs.html" class="nav-link">Jobs</a>
    <a href="schedule.html" class="nav-link">Schedule</a>
    <a href="cleanouts.html" class="nav-link">Cleanouts</a>
  </div>
  <div class="nav-spacer"></div>
  <button class="btn btn-outline btn-sm" onclick="logout()" style="color:#fff;border-color:rgba(255,255,255,.4)">Sign Out</button>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Quote Queue</h1>
    <div style="display:flex;gap:.5rem;align-items:center">
      <select id="filter-status" class="form-control" style="width:180px" onchange="loadQuotes()">
        <option value="pending_review">Pending Review</option>
        <option value="sent">Sent to Customer</option>
        <option value="accepted">Accepted</option>
        <option value="declined">Declined</option>
        <option value="rejected">Rejected</option>
        <option value="">All Quotes</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="loadQuotes()">↺ Refresh</button>
    </div>
  </div>

  <div id="quotes-container">
    <div class="loading"><div class="spinner"></div> Loading quotes...</div>
  </div>
</div>

<!-- Photo / Detail Modal -->
<div id="photo-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">📸 Job Photo</span>
      <button class="modal-close" onclick="closeModal('photo-modal')">✕</button>
    </div>
    <div class="modal-body" style="padding:.5rem">
      <img id="modal-photo" src="" style="width:100%;border-radius:6px" alt="Job photo">
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let allQuotes = [];

async function loadQuotes() {
  const status = document.getElementById('filter-status').value;
  const container = document.getElementById('quotes-container');
  container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';

  try {
    const url = status ? `/api/quotes?status=${status}` : '/api/quotes';
    allQuotes = await API.get(url);
    renderQuotes(allQuotes);
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>${err.message}</h3></div>`;
  }
}

function renderQuotes(quotes) {
  const container = document.getElementById('quotes-container');
  if (!quotes.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>No quotes in this category</h3></div>';
    return;
  }
  container.innerHTML = `<div class="quote-grid">${quotes.map(quoteCard).join('')}</div>`;
}

function quoteCard(q) {
  const analysis = q.analysis || {};
  const isPending = q.status === 'pending_review';
  const surcharges = [
    { label: 'Tires', field: 'tire_surcharge', count: analysis.special_items?.tires },
    { label: 'Appliances', field: 'appliance_surcharge', count: analysis.special_items?.appliances },
    { label: 'Mattresses', field: 'mattress_surcharge', count: analysis.special_items?.mattresses },
    { label: 'Electronics', field: 'electronics_surcharge', count: analysis.special_items?.electronics },
    { label: 'Hazmat', field: 'hazmat_surcharge', count: analysis.special_items?.hazmat },
  ];

  return `
  <div class="quote-card" id="quote-${q.id}">
    <div class="quote-photo" onclick="openPhoto('${q.photo_url}')">
      ${q.photo_url
        ? `<img src="${q.photo_url}" alt="Job photo" onerror="this.parentElement.innerHTML='<span>📷 No preview</span>'" style="cursor:zoom-in">`
        : '<span>📷 No photo</span>'}
    </div>
    <div class="quote-body">
      <div class="quote-meta">
        <div>
          <div class="quote-phone">${fmtPhone(q.phone)}</div>
          <div style="font-size:.8rem;color:var(--gray-500);margin-top:.1rem">${fmtDateTime(q.created_at)}</div>
        </div>
        ${statusBadge(q.status)}
      </div>

      ${analysis.notes ? `<div style="font-size:.83rem;color:var(--gray-700);margin-bottom:.75rem;padding:.5rem;background:var(--gray-50);border-radius:6px;border-left:3px solid var(--green-light)">🤖 ${analysis.notes}</div>` : ''}

      ${analysis.materials?.length ? `
        <div style="margin-bottom:.5rem">
          ${analysis.materials.map(m => `<span style="display:inline-block;background:var(--gray-200);border-radius:20px;padding:.15rem .5rem;font-size:.75rem;margin:.15rem .15rem 0 0">${m}</span>`).join('')}
        </div>` : ''}

      <!-- Pricing Fields -->
      <div class="price-grid" id="fields-${q.id}">
        <div class="price-field" style="grid-column:1/-1">
          <label>Load Size</label>
          <select class="form-control" id="load_size-${q.id}" ${!isPending ? 'disabled' : ''} onchange="recalcTotal(${q.id})">
            <option value="">— Select —</option>
            ${['quarter','half','three_quarter','full'].map(s =>
              `<option value="${s}" ${q.load_size === s ? 'selected' : ''}>${loadSize(s)}</option>`).join('')}
          </select>
        </div>
        <div class="price-field">
          <label>Base Price ($)</label>
          <input type="number" id="base_price-${q.id}" value="${q.base_price || ''}" min="0" step="5" ${!isPending ? 'disabled' : ''} onchange="recalcTotal(${q.id})">
        </div>
        <div class="price-field">
          <label>Fuel Surcharge ($)</label>
          <input type="number" id="fuel_surcharge-${q.id}" value="${q.fuel_surcharge || ''}" min="0" step="5" ${!isPending ? 'disabled' : ''} onchange="recalcTotal(${q.id})">
        </div>
        ${surcharges.map(s => `
        <div class="price-field">
          <label>${s.label} Fee ($)</label>
          <input type="number" id="${s.field}-${q.id}" value="${q[s.field] || ''}" min="0" step="5" ${!isPending ? 'disabled' : ''} onchange="recalcTotal(${q.id})">
        </div>`).join('')}
        <div class="price-field">
          <label>Other Fee ($)</label>
          <input type="number" id="other_surcharge-${q.id}" value="${q.other_surcharge || ''}" min="0" step="5" ${!isPending ? 'disabled' : ''} onchange="recalcTotal(${q.id})">
        </div>
        <div class="price-field" style="grid-column:1/-1">
          <label>Owner Notes (included in quote SMS)</label>
          <input type="text" id="owner_notes-${q.id}" value="${q.owner_notes || ''}" placeholder="Optional note to customer..." ${!isPending ? 'disabled' : ''}>
        </div>
      </div>

      <div class="total-row">
        <span>Total Quote</span>
        <span class="total-amount" id="total-${q.id}">${fmt$$(q.total_price)}</span>
      </div>

      ${q.message ? `<div style="font-size:.82rem;color:var(--gray-700);margin-top:.25rem">💬 "${q.message}"</div>` : ''}
    </div>

    <div class="quote-actions">
      ${isPending ? `
        <button class="btn btn-primary" onclick="saveAndApprove(${q.id})" style="flex:1">
          ✓ Approve & Send
        </button>
        <button class="btn btn-danger btn-sm" onclick="rejectQuote(${q.id})" title="Reject">✕</button>
      ` : ''}
      ${q.status === 'sent' ? `
        <button class="btn btn-outline btn-sm" onclick="resendQuote(${q.id})">↺ Resend</button>
      ` : ''}
      ${q.status === 'accepted' ? `
        <a href="jobs.html" class="btn btn-primary btn-sm">→ View Job</a>
      ` : ''}
    </div>
  </div>`;
}

function getFields(id) {
  const get = (f) => document.getElementById(`${f}-${id}`)?.value || '';
  return {
    load_size: get('load_size'),
    base_price: parseFloat(get('base_price')) || 0,
    fuel_surcharge: parseFloat(get('fuel_surcharge')) || 0,
    tire_surcharge: parseFloat(get('tire_surcharge')) || 0,
    appliance_surcharge: parseFloat(get('appliance_surcharge')) || 0,
    mattress_surcharge: parseFloat(get('mattress_surcharge')) || 0,
    electronics_surcharge: parseFloat(get('electronics_surcharge')) || 0,
    hazmat_surcharge: parseFloat(get('hazmat_surcharge')) || 0,
    other_surcharge: parseFloat(get('other_surcharge')) || 0,
    owner_notes: get('owner_notes'),
  };
}

function recalcTotal(id) {
  const f = getFields(id);
  const total = f.base_price + f.fuel_surcharge + f.tire_surcharge +
    f.appliance_surcharge + f.mattress_surcharge + f.electronics_surcharge +
    f.hazmat_surcharge + f.other_surcharge;
  const el = document.getElementById(`total-${id}`);
  if (el) el.textContent = fmt$$(total);
}

async function saveAndApprove(id) {
  const fields = getFields(id);
  if (!fields.base_price || fields.base_price === 0) {
    showToast('Please enter a base price before approving', 'error');
    document.getElementById(`base_price-${id}`)?.focus();
    return;
  }
  try {
    await API.put(`/api/quotes/${id}`, fields);
    await API.post(`/api/quotes/${id}/approve`);
    showToast('Quote approved and sent to customer!', 'success');
    loadQuotes();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function rejectQuote(id) {
  if (!confirm('Reject this quote? This cannot be undone.')) return;
  try {
    await API.post(`/api/quotes/${id}/reject`);
    showToast('Quote rejected');
    loadQuotes();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function resendQuote(id) {
  try {
    await API.post(`/api/quotes/${id}/resend`);
    showToast('Quote resent!', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function openPhoto(url) {
  if (!url) return;
  document.getElementById('modal-photo').src = url;
  document.getElementById('photo-modal').classList.remove('hidden');
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function logout() {
  localStorage.removeItem('gbm_token');
  window.location.href = '/login.html';
}

// Close modal on overlay click
document.getElementById('photo-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('photo-modal');
});

loadQuotes();
</script>
</body>
</html>
